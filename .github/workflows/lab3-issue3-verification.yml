name: Lab 3 Issue 3 Verification

on:
  pull_request:
    branches:
      - lab3-staging
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - lab3-staging
      - "feature/**"

permissions:
  contents: read

jobs:
  issue-3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root E2E dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run focused Issue 3 client gate
        run: >-
          npm test --
          tests/lab-03/AuthProvider.test.tsx
          tests/lab-03/Login.test.tsx
          tests/lab-03/ChangePassword.test.tsx
          tests/lab-03/ApplicationShellAuth.test.tsx
          tests/lab-03/CommonForm.test.tsx
          tests/lab-03/Accessibility.test.tsx
          tests/lab-03/ErrorPageAuth.test.tsx
          -t '@issue-3'
        working-directory: client

      - name: Run full client regression suite
        run: npm test
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Run Issue 3 Playwright gate
        env:
          ISSUE_3_UI_ONLY: "1"
        run: >-
          npm run test:e2e --
          --grep '@issue-3'
          e2e/lab-03/authentication.spec.ts
          e2e/lab-03/responsive-visual.spec.ts

      - name: Upload Issue 3 Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-issue3-playwright-report
          path: |
            artifacts/lab-03/playwright-report
            artifacts/lab-03/playwright
          if-no-files-found: ignore

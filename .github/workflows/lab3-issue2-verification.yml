name: Lab 3 Issue 2 Verification

on:
  pull_request:
    branches:
      - lab3-staging
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - lab3-staging
      - "feature/**"

permissions:
  contents: read

env:
  LAB3_TEST_DATABASE_URL: postgresql://lab3_test@127.0.0.1:5432/toktickit_lab3_test
  LAB3_BASELINE_DATABASE_URL: postgresql://lab3_test@127.0.0.1:5432/toktickit_lab3_baseline
  LAB3_BASELINE_DIRECT_URL: postgresql://lab3_test@127.0.0.1:5432/toktickit_lab3_baseline
  DATABASE_URL: postgresql://lab3_test@127.0.0.1:5432/toktickit_lab3_baseline
  DIRECT_URL: postgresql://lab3_test@127.0.0.1:5432/toktickit_lab3_baseline
  CORS_ALLOWED_ORIGINS: http://localhost:5173

jobs:
  issue-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: toktickit_lab3_baseline
          POSTGRES_USER: lab3_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab3_test -d toktickit_lab3_baseline"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Capture normal CI database baselines
        run: |
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          test "$DATABASE_URL" = "$LAB3_BASELINE_DATABASE_URL"
          test "$DIRECT_URL" = "$LAB3_BASELINE_DIRECT_URL"
          echo "Captured normal CI database baselines before test-target overrides."

      - name: Create dedicated Lab 3 database
        run: createdb -h 127.0.0.1 -U lab3_test --maintenance-db=toktickit_lab3_baseline toktickit_lab3_test

      - name: Check guarded migration target
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: |
          set +e
          status_output="$(npx --no-install prisma migrate status 2>&1)"
          status_code=$?
          set -e
          printf '%s\n' "$status_output"

          printf '%s\n' "$status_output" | grep -Fq 'Datasource "db": PostgreSQL database "toktickit_lab3_test", schema "public" at "127.0.0.1:5432"'
          if [ "$status_code" -ne 0 ]; then
            [ "$status_code" -eq 1 ]
            printf '%s\n' "$status_output" | grep -Fq 'Following migrations have not yet been applied:'
          fi

      - name: Deploy Lab 3 migrations
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: npx --no-install prisma migrate deploy

      - name: Seed Lab 3 database twice
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: |
          npm run prisma:seed
          npm run prisma:seed

      - name: Run maintenance cleanup twice
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: |
          npm run maintenance:cleanup
          npm run maintenance:cleanup

      - name: Run focused Issue 2 unit and API gate
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: >-
          npm test --
          tests/lab-03/PasswordService.test.ts
          tests/lab-03/InitialPasswordGenerator.test.ts
          tests/lab-03/JwtService.test.ts
          tests/lab-03/SessionService.test.ts
          tests/lab-03/LoginRateLimitService.test.ts
          tests/lab-03/AuthService.test.ts
          tests/lab-03/MaintenanceService.test.ts
          tests/lab-03/databaseTargetGuard.test.ts
          tests/lab-03/auth.api.test.ts
          tests/lab-03/authorization.api.test.ts
          tests/lab-03/auth-transport.api.test.ts
          tests/lab-03/error-contract.api.test.ts
          -t '@issue-2'

      - name: Run focused Issue 2 PostgreSQL gate
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: >-
          npm test --
          tests/lab-03/postgres/migration-upgrade.postgres.test.ts
          tests/lab-03/postgres/schema-contract.postgres.test.ts
          tests/lab-03/postgres/auth-session.postgres.test.ts
          tests/lab-03/postgres/rate-limit.postgres.test.ts
          tests/lab-03/postgres/maintenance.postgres.test.ts
          -t '@issue-2'

      - name: Run full server regression suite from Lab 1 through Lab 3
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.LAB3_TEST_DATABASE_URL }}
          LAB3_BASELINE_DATABASE_URL: ${{ env.LAB3_BASELINE_DATABASE_URL }}
          LAB3_BASELINE_DIRECT_URL: ${{ env.LAB3_BASELINE_DIRECT_URL }}
        run: npm test

      - name: Build server
        run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run full client regression suite from Lab 1 through Lab 2
        run: npm test

      - name: Build client
        run: npm run build

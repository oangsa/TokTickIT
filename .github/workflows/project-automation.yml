name: Project Automation

on:
  create:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  PROJECT_OWNER: oangsa
  PROJECT_NUMBER: 2

jobs:
  close-issues-on-merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Close issues linked from the merged pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = context.payload.pull_request.body || '';
            const matches = [...new Set([...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]))];

            for (const issueNum of matches) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNum),
                state: 'closed',
                state_reason: 'completed',
              });
            }

  set-started-on-branch:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issue to "Started"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = '${{ env.PROJECT_OWNER }}';
            const number = ${{ env.PROJECT_NUMBER }};
            const targetStatus = 'Started';

            // Extract the first issue number from the branch name
            // (e.g. feature/123-add-login -> 123, 456-fix -> 456)
            const branch = context.payload.ref || '';
            const match = branch.match(/(?:^|[/_-])(\d+)(?:[/_-]|$)/);
            if (!match) return;
            const issueNum = parseInt(match[1]);

            const proj = await github.graphql(`
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    id
                    field(name:"Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first:100) {
                      nodes {
                        id
                        fieldValueByName(name:"Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            state
                            assignees(first:20) { nodes { login } }
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { owner, number });

            const project = proj.user.projectV2;
            const option = project.field.options.find(o => o.name === targetStatus);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const actor = context.actor;

            const item = project.items.nodes.find(n =>
              n.content?.number === issueNum &&
              n.content?.repository?.nameWithOwner === repo
            );
            if (!item) {
              core.info(`Skipping issue #${issueNum}: it is not in the target project.`);
              return;
            }
            if (item.content.state !== 'OPEN') {
              core.info(`Skipping issue #${issueNum}: it is not open.`);
              return;
            }
            const assignees = item.content.assignees.nodes.map(a => a.login);
            if (!assignees.includes(actor)) {
              core.warning(`Skipping issue #${issueNum}: branch creator ${actor} is not an assignee.`);
              return;
            }
            if (item.fieldValueByName?.name !== 'Specified') {
              core.info(`Skipping issue #${issueNum}: expected status Specified, found ${item.fieldValueByName?.name || 'unset'}.`);
              return;
            }
            if (!option) throw new Error(`Project status option not found: ${targetStatus}`);
            await github.graphql(`
              mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
                updateProjectV2ItemFieldValue(input:{
                  projectId:$p, itemId:$i, fieldId:$f,
                  value:{ singleSelectOptionId:$o }
                }) { projectV2Item { id } }
              }`, { p: project.id, i: item.id, f: project.field.id, o: option.id });

  set-pull-request:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to "PR Review"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = '${{ env.PROJECT_OWNER }}';
            const number = ${{ env.PROJECT_NUMBER }};
            const targetStatus = 'PR Review';

            const body = context.payload.pull_request.body || '';
            const matches = [...new Set([...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]))];
            if (matches.length === 0) return;

            const proj = await github.graphql(`
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    id
                    field(name:"Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first:100) {
                      nodes {
                        id
                        fieldValueByName(name:"Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            state
                            assignees(first:20) { nodes { login } }
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { owner, number });

            const project = proj.user.projectV2;
            const option = project.field.options.find(o => o.name === targetStatus);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const prAuthor = context.payload.pull_request.user.login;
            if (!option) throw new Error(`Project status option not found: ${targetStatus}`);

            for (const issueNum of matches) {
              const item = project.items.nodes.find(n =>
                n.content?.number === parseInt(issueNum) &&
                n.content?.repository?.nameWithOwner === repo
              );
              if (!item || item.content.state !== 'OPEN') continue;
              const assignees = item.content.assignees.nodes.map(a => a.login);
              if (!assignees.includes(prAuthor)) {
                core.warning(`Skipping issue #${issueNum}: PR author ${prAuthor} is not an assignee.`);
                continue;
              }
              if (!['Started', 'Fixing'].includes(item.fieldValueByName?.name)) {
                core.info(`Skipping issue #${issueNum}: cannot move ${item.fieldValueByName?.name || 'unset'} to ${targetStatus}.`);
                continue;
              }
              await github.graphql(`
                mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$p, itemId:$i, fieldId:$f,
                    value:{ singleSelectOptionId:$o }
                  }) { projectV2Item { id } }
                }`, { p: project.id, i: item.id, f: project.field.id, o: option.id });
            }

  set-fixing-on-changes-requested:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to "Fixing"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = '${{ env.PROJECT_OWNER }}';
            const number = ${{ env.PROJECT_NUMBER }};
            const targetStatus = 'Fixing';

            const body = context.payload.pull_request.body || '';
            const matches = [...new Set([...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]))];
            if (matches.length === 0) return;

            const proj = await github.graphql(`
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    id
                    field(name:"Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first:100) {
                      nodes {
                        id
                        fieldValueByName(name:"Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            state
                            assignees(first:20) { nodes { login } }
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { owner, number });

            const project = proj.user.projectV2;
            const option = project.field.options.find(o => o.name === targetStatus);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const prAuthor = context.payload.pull_request.user.login;
            if (!option) throw new Error(`Project status option not found: ${targetStatus}`);

            for (const issueNum of matches) {
              const item = project.items.nodes.find(n =>
                n.content?.number === parseInt(issueNum) &&
                n.content?.repository?.nameWithOwner === repo
              );
              if (!item || item.content.state !== 'OPEN') continue;
              const assignees = item.content.assignees.nodes.map(a => a.login);
              if (!assignees.includes(prAuthor)) {
                core.warning(`Skipping issue #${issueNum}: PR author ${prAuthor} is not an assignee.`);
                continue;
              }
              if (item.fieldValueByName?.name !== 'PR Review') {
                core.info(`Skipping issue #${issueNum}: expected status PR Review, found ${item.fieldValueByName?.name || 'unset'}.`);
                continue;
              }
              await github.graphql(`
                mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$p, itemId:$i, fieldId:$f,
                    value:{ singleSelectOptionId:$o }
                  }) { projectV2Item { id } }
                }`, { p: project.id, i: item.id, f: project.field.id, o: option.id });
            }

  back-to-pr-after-fix:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Move "Fixing" items back to "PR Review" after new commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = '${{ env.PROJECT_OWNER }}';
            const number = ${{ env.PROJECT_NUMBER }};
            const targetStatus = 'PR Review';
            const fromStatus = 'Fixing';

            const body = context.payload.pull_request.body || '';
            const matches = [...new Set([...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]))];
            if (matches.length === 0) return;

            const proj = await github.graphql(`
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    id
                    field(name:"Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first:100) {
                      nodes {
                        id
                        fieldValueByName(name:"Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            state
                            assignees(first:20) { nodes { login } }
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { owner, number });

            const project = proj.user.projectV2;
            const option = project.field.options.find(o => o.name === targetStatus);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const prAuthor = context.payload.pull_request.user.login;
            if (!option) throw new Error(`Project status option not found: ${targetStatus}`);

            for (const issueNum of matches) {
              const item = project.items.nodes.find(n =>
                n.content?.number === parseInt(issueNum) &&
                n.content?.repository?.nameWithOwner === repo &&
                n.fieldValueByName?.name === fromStatus
              );
              if (!item || item.content.state !== 'OPEN') continue;
              const assignees = item.content.assignees.nodes.map(a => a.login);
              if (!assignees.includes(prAuthor)) {
                core.warning(`Skipping issue #${issueNum}: PR author ${prAuthor} is not an assignee.`);
                continue;
              }
              await github.graphql(`
                mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$p, itemId:$i, fieldId:$f,
                    value:{ singleSelectOptionId:$o }
                  }) { projectV2Item { id } }
                }`, { p: project.id, i: item.id, f: project.field.id, o: option.id });
            }

services:
  lab3-test-postgres:
    image: postgres:16-alpine
    container_name: toktickit-lab3-test-postgres
    environment:
      POSTGRES_DB: toktickit_lab3_test
      POSTGRES_USER: lab3_test
      POSTGRES_PASSWORD: ${LAB3_TEST_DB_PASSWORD:?Set LAB3_TEST_DB_PASSWORD}
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab3_test -d toktickit_lab3_test"]
      interval: 2s
      timeout: 5s
      retries: 15
